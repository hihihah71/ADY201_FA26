[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ady201-fa26"
version = "0.1.0"
description = "Urban services and road-network analysis pipeline for Vietnam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "pyrosm",
    "geopandas",
    "pyarrow",
    "matplotlib",
    "networkx"
]

[project.scripts]
ady201 = "ady201.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
